name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Матрица Node: нижняя граница engines (>=20.19, как Р28 агента) и текущая LTS (служебная 14.10, П3; как AG-04 К3.1 агента).
  # PostgreSQL и страж PG-тестов (К2.4) — в каждой ветке матрицы.
  test-node:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Аудит зависимостей работающего кода
        run: npm audit --omit=dev --audit-level=high
      - name: Аудит инструментов разработки
        run: npm audit --audit-level=high
      - name: Проверка типов
        run: npm run check
      - name: Тесты и сценарии приёмки (PostgreSQL — сервис postgres:16)
        run: npm test -- --reporter=verbose
        env:
          DATABASE_URL: postgres://core:core@localhost:5432/core
      - name: Поиск ключей и реквизитов
        run: python3 .claude/hooks/scan_secrets.py .

  # Итоговая проверка под прежним именем test — её требует защита ветки main, имя не меняется.
  # if: always() обязателен: без него при красной матрице test была бы пропущена (skipped), а пропущенная обязательная
  # проверка засчитывается как пройденная (ревью #23 агента п. 1). Зелёная — только при success всей матрицы.
  test:
    needs: test-node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Матрица Node прошла целиком
        run: test "${{ needs.test-node.result }}" = "success"
