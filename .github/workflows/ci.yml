name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Аудит зависимостей работающего кода
        run: npm audit --omit=dev --audit-level=high
      - name: Аудит инструментов разработки
        run: npm audit --audit-level=high
      - name: Проверка типов
        run: npm run check
      - name: Тесты и сценарии приёмки (PostgreSQL — сервис postgres:16)
        run: npm test -- --reporter=verbose
        env:
          DATABASE_URL: postgres://core:core@localhost:5432/core
      - name: Поиск ключей и реквизитов
        run: python3 .claude/hooks/scan_secrets.py .
